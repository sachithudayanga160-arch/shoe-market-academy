name: Daily Shoe Market Update

on:
  schedule:
    # 01:30 UTC = 07:00 Sri Lanka
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate fresh daily feed
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-daily.mjs

      - name: Commit updated feed
        run: |
          git config user.name "shoe-academy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily shoe market update"
            git push
          fi
